[package]
name = "lings"
version = "0.1.0"
description = "A bilingual local sound effects library manager"
authors = ["Lings"]
edition = "2021"

[lib]
name = "lings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.22"
dirs = "6"
parking_lot = "0.12"
roxmltree = "0.20"
